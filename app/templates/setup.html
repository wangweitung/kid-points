{% extends "narrow.html" %}
{% block title %}初始化管理员 · 小星星积分计划{% endblock %}
{% block content %}
<h1>创建管理员</h1>
<p class="muted">首次使用，请设置管理员账号和密码。</p>
<form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>用户名
    <input type="text" name="username" value="{{ username or '' }}" required autofocus>
  </label>
  <label>密码
    <input type="password" name="password" required minlength="4">
  </label>
  <label>确认密码
    <input type="password" name="confirm" required minlength="4">
  </label>
  <button type="submit" class="btn btn-primary btn-block">创建并登录</button>
</form>
{% endblock %}
