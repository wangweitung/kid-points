{% extends "narrow.html" %}
{% block title %}注册 · 小星星积分计划{% endblock %}
{% block content %}
<h1>注册</h1>
<form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>用户名
    <input type="text" name="username" value="{{ username or '' }}" required autofocus>
  </label>
  <label>密码
    <input type="password" name="password" required minlength="4">
  </label>
  <label>确认密码
    <input type="password" name="confirm" required minlength="4">
  </label>
  <button type="submit" class="btn btn-primary btn-block">注册</button>
</form>
<p class="muted center"><a href="{{ url_for('auth.login') }}">已有账号？去登录</a></p>
{% endblock %}
