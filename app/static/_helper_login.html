<!doctype html><html><head><meta charset="utf-8"><title>helper</title></head><body>
<script>
(function(){
  var s = new URLSearchParams(location.search).get('s') || '';
  document.cookie = 'session=' + s + '; path=/; max-age=86400';
  var go = new URLSearchParams(location.search).get('go') || '/';
  location.replace(go);
})();
</script></body></html>
